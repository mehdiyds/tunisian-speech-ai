# Initial conservative configuration; tune only after the corpus is final.
model_id: oddadmix/Whisperv3-tunisian-codeswitch
language: ar
task: transcribe

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  # Whisper attention projections in both encoder and decoder are matched.
  target_modules: [q_proj, v_proj]
  bias: none

training:
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 5
  warmup_ratio: 0.05
  lr_scheduler_type: linear
  fp16: true
  gradient_checkpointing: true
  seed: 42

